name: image_editor
description: "Chromivelle — a dark, dynamic-color photo editor with live GPU previews."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  material_expressive: ^0.8.0
  flutter_riverpod: ^3.4.3
  image_picker: ^1.2.3
  dynamic_color: ^1.8.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  shaders:
    - assets/shaders/adjust.frag
    - assets/shaders/selective_color.frag
    - assets/shaders/lut3d.frag
